# The published packages, so `@pidgeon-ai/cli`, `@pidgeon-ai/mcp` and `@pidgeon-ai/ai-sdk`
# resolve the `workspace:*` SDK they depend on — and so `pnpm pack` rewrites
# that protocol to a real version on the way out.
packages:
  - packages/*
  # Runs the packages beside it, so it takes them from here, not npm.
  - examples/self-hosted-issuer
